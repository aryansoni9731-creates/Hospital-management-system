<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Choose Language</title>
      <link rel="stylesheet" href="css/language.css">
</head>
<body>
  <main class="box">
    <div class="logo">🏥</div>
    <h1>Choose Your Language</h1>
    <p class="subtitle">अपनी भाषा चुनें</p>

    <div class="languages">
      <button class="language-btn" onclick="chooseLanguage('en')">
        <span class="native">🇬🇧</span>
        English
      </button>
      <button class="language-btn" onclick="chooseLanguage('hi')">
        <span class="native">🇮🇳</span>
        हिंदी
      </button>
    </div>

    <div class="note">You can change your language later.</div>
  </main>

      <script src="js/language.js"></script>
</body>
</html>
