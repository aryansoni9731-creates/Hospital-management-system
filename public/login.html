<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>

      <link rel="stylesheet" href="css/login.css">
  <script src="js/language.js"></script>
</head>

<body>

  <header>🔐 Patient Login / मरीज लॉगिन</header>

  <div class="container">
    <div class="form-box">

      <h2>Login</h2>

      <div class="input-group">
        <input type="tel" id="phone" placeholder="Phone Number (10 digits)" maxlength="10" required>
      </div>

      <div class="input-group">
        <input type="password" id="password" placeholder="Password" required>
        <span class="toggle-pw" onclick="togglePasswordVisibility()" title="Show/Hide Password">👁️</span>
      </div>

      <button id="loginBtn" onclick="login()">Login</button>

      <div class="link">
        <p>New user? <a href="register.html">Register here</a></p>
      </div>

    </div>
  </div>

      <script src="js/login.js"></script>

</body>

</html>
